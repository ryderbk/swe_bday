<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <!-- Gradients for roses -->
    <radialGradient id="roseDark" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#850a1a" />
      <stop offset="65%" stop-color="#52040d" />
      <stop offset="100%" stop-color="#300006" />
    </radialGradient>
    <radialGradient id="roseRed" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e61937" />
      <stop offset="45%" stop-color="#b80c23" />
      <stop offset="85%" stop-color="#7a0614" />
      <stop offset="100%" stop-color="#47020a" />
    </radialGradient>
    <radialGradient id="roseBright" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff3352" />
      <stop offset="50%" stop-color="#c9102c" />
      <stop offset="90%" stop-color="#800615" />
      <stop offset="100%" stop-color="#420007" />
    </radialGradient>
    <radialGradient id="roseHighlight" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ff6b82" />
      <stop offset="40%" stop-color="#d91635" />
      <stop offset="80%" stop-color="#8f0a1c" />
      <stop offset="100%" stop-color="#47020a" />
    </radialGradient>
    <!-- Foliage gradients -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b7838" />
      <stop offset="50%" stop-color="#2d4e20" />
      <stop offset="100%" stop-color="#182e10" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#62944b" />
      <stop offset="60%" stop-color="#385e28" />
      <stop offset="100%" stop-color="#1d3314" />
    </linearGradient>
    <!-- Stems gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b3112" />
      <stop offset="40%" stop-color="#3e6329" />
      <stop offset="70%" stop-color="#2e4d1e" />
      <stop offset="100%" stop-color="#16280e" />
    </linearGradient>
    <!-- Ribbon gradients -->
    <linearGradient id="ribbonRed" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c91830" />
      <stop offset="35%" stop-color="#e62e48" />
      <stop offset="70%" stop-color="#960d1f" />
      <stop offset="100%" stop-color="#5e0410" />
    </linearGradient>
    <radialGradient id="ribbonKnot" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f24b64" />
      <stop offset="50%" stop-color="#c4162e" />
      <stop offset="100%" stop-color="#660412" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.55" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- BACKGROUND LEAVES -->
    <path d="M170 230 C120 180 90 210 70 260 C90 280 140 270 175 250 Z" fill="url(#leafGrad1)" />
    <path d="M140 210 C80 140 120 90 170 110 C180 140 165 180 145 210 Z" fill="url(#leafGrad2)" />
    <path d="M210 160 C180 80 230 40 260 70 C265 110 240 140 215 160 Z" fill="url(#leafGrad1)" />
    <path d="M330 230 C380 180 410 210 430 260 C410 280 360 270 325 250 Z" fill="url(#leafGrad1)" />
    <path d="M360 210 C420 140 380 90 330 110 C320 140 335 180 355 210 Z" fill="url(#leafGrad2)" />
    <path d="M290 160 C320 80 270 40 240 70 C235 110 260 140 285 160 Z" fill="url(#leafGrad2)" />
    <path d="M250 130 C250 50 280 40 290 80 C280 110 265 125 250 130 Z" fill="url(#leafGrad1)" />

    <!-- STEMS BUNDLE (LOWER) -->
    <g>
      <path d="M210 320 Q225 390 230 460 Q235 480 230 500" stroke="url(#stemGrad)" stroke-width="9" stroke-linecap="round" fill="none" />
      <path d="M235 320 Q240 390 245 465 Q248 485 242 505" stroke="url(#stemGrad)" stroke-width="11" stroke-linecap="round" fill="none" />
      <path d="M260 320 Q255 395 252 470 Q250 490 252 508" stroke="url(#stemGrad)" stroke-width="10" stroke-linecap="round" fill="none" />
      <path d="M280 320 Q268 395 262 465 Q258 485 264 502" stroke="url(#stemGrad)" stroke-width="9" stroke-linecap="round" fill="none" />
      <path d="M220 320 Q235 400 248 485" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
      <path d="M275 320 Q258 400 242 485" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
    </g>

    <!-- BOUQUET WRAPPER / BASE SHADOW -->
    <ellipse cx="250" cy="265" rx="145" ry="115" fill="#1c0205" opacity="0.75" />

    <!-- BACK LAYER ROSES -->
    <!-- Rose: Top Center Back (x: 250, y: 135) -->
    <g transform="translate(250, 135) scale(0.72)">
      <ellipse cx="0" cy="0" rx="55" ry="48" fill="url(#roseDark)" />
      <path d="M-42 -10 C-38 -35 38 -35 42 -10 C46 25 -46 25 -42 -10 Z" fill="url(#roseRed)" />
      <path d="M-28 -5 C-25 -24 25 -24 28 -5 C32 18 -32 18 -28 -5 Z" fill="url(#roseBright)" />
      <path d="M-16 0 C-12 -12 12 -12 16 0 C18 10 -18 10 -16 0 Z" fill="url(#roseHighlight)" />
      <circle cx="0" cy="0" r="7" fill="#47020a" />
    </g>

    <!-- Rose: Top Left (x: 185, y: 160) -->
    <g transform="translate(185, 160) scale(0.78)">
      <ellipse cx="0" cy="0" rx="55" ry="48" fill="url(#roseDark)" />
      <path d="M-45 -12 C-38 -38 35 -38 42 -12 C48 24 -46 26 -45 -12 Z" fill="url(#roseRed)" />
      <path d="M-30 -6 C-25 -25 25 -25 28 -6 C32 18 -32 18 -30 -6 Z" fill="url(#roseBright)" />
      <path d="M-18 0 C-14 -14 14 -14 18 0 C20 12 -20 12 -18 0 Z" fill="url(#roseHighlight)" />
      <circle cx="0" cy="0" r="7" fill="#47020a" />
    </g>

    <!-- Rose: Top Right (x: 315, y: 160) -->
    <g transform="translate(315, 160) scale(0.78)">
      <ellipse cx="0" cy="0" rx="55" ry="48" fill="url(#roseDark)" />
      <path d="M-42 -12 C-35 -38 38 -38 45 -12 C46 26 -48 24 -42 -12 Z" fill="url(#roseRed)" />
      <path d="M-28 -6 C-25 -25 25 -25 30 -6 C32 18 -32 18 -28 -6 Z" fill="url(#roseBright)" />
      <path d="M-18 0 C-14 -14 14 -14 18 0 C20 12 -20 12 -18 0 Z" fill="url(#roseHighlight)" />
      <circle cx="0" cy="0" r="7" fill="#47020a" />
    </g>

    <!-- MID LAYER ROSES -->
    <!-- Rose: Mid Far Left (x: 135, y: 220) -->
    <g transform="translate(135, 220) scale(0.85)">
      <ellipse cx="0" cy="0" rx="58" ry="50" fill="url(#roseDark)" />
      <path d="M-46 -15 C-40 -40 38 -40 45 -15 C49 26 -48 28 -46 -15 Z" fill="url(#roseRed)" />
      <path d="M-32 -8 C-26 -28 26 -28 32 -8 C35 20 -34 20 -32 -8 Z" fill="url(#roseBright)" />
      <path d="M-18 0 C-14 -15 14 -15 18 0 C20 12 -20 12 -18 0 Z" fill="url(#roseHighlight)" />
      <circle cx="0" cy="0" r="8" fill="#47020a" />
    </g>

    <!-- Rose: Mid Far Right (x: 365, y: 220) -->
    <g transform="translate(365, 220) scale(0.85)">
      <ellipse cx="0" cy="0" rx="58" ry="50" fill="url(#roseDark)" />
      <path d="M-45 -15 C-38 -40 40 -40 46 -15 C48 28 -49 26 -45 -15 Z" fill="url(#roseRed)" />
      <path d="M-32 -8 C-26 -28 26 -28 32 -8 C34 20 -35 20 -32 -8 Z" fill="url(#roseBright)" />
      <path d="M-18 0 C-14 -15 14 -15 18 0 C20 12 -20 12 -18 0 Z" fill="url(#roseHighlight)" />
      <circle cx="0" cy="0" r="8" fill="#47020a" />
    </g>

    <!-- Rose: Mid Left (x: 195, y: 235) -->
    <g transform="translate(195, 235) scale(0.95)">
      <ellipse cx="0" cy="0" rx="60" ry="52" fill="url(#roseDark)" />
      <path d="M-48 -16 C-42 -42 40 -42 48 -16 C52 28 -50 30 -48 -16 Z" fill="url(#roseRed)" />
      <path d="M-34 -9 C-28 -30 28 -30 34 -9 C38 22 -36 22 -34 -9 Z" fill="url(#roseBright)" />
      <path d="M-20 -2 C-15 -18 15 -18 20 -2 C22 14 -22 14 -20 -2 Z" fill="url(#roseHighlight)" />
      <path d="M-10 2 Q0 -8 10 2 Q0 12 -10 2 Z" fill="#ffd1dc" opacity="0.5" />
      <circle cx="0" cy="0" r="8" fill="#47020a" />
    </g>

    <!-- Rose: Mid Right (x: 305, y: 235) -->
    <g transform="translate(305, 235) scale(0.95)">
      <ellipse cx="0" cy="0" rx="60" ry="52" fill="url(#roseDark)" />
      <path d="M-48 -16 C-40 -42 42 -42 48 -16 C50 30 -52 28 -48 -16 Z" fill="url(#roseRed)" />
      <path d="M-34 -9 C-28 -30 28 -30 34 -9 C36 22 -38 22 -34 -9 Z" fill="url(#roseBright)" />
      <path d="M-20 -2 C-15 -18 15 -18 20 -2 C22 14 -22 14 -20 -2 Z" fill="url(#roseHighlight)" />
      <path d="M-10 2 Q0 -8 10 2 Q0 12 -10 2 Z" fill="#ffd1dc" opacity="0.5" />
      <circle cx="0" cy="0" r="8" fill="#47020a" />
    </g>

    <!-- FOREGROUND / CENTER ROSES -->
    <!-- Rose: Big Center Master Rose (x: 250, y: 215) -->
    <g transform="translate(250, 215) scale(1.15)">
      <ellipse cx="0" cy="0" rx="64" ry="56" fill="url(#roseDark)" />
      <path d="M-52 -18 C-45 -48 45 -48 52 -18 C56 32 -54 34 -52 -18 Z" fill="url(#roseRed)" />
      <path d="M-44 5 C-52 -22 -15 -46 20 -38 C55 -28 54 18 36 34 C12 45 -28 35 -44 5 Z" fill="url(#roseBright)" />
      <path d="M-38 -10 C-32 -34 32 -34 38 -10 C42 26 -40 26 -38 -10 Z" fill="url(#roseRed)" />
      <path d="M-25 -5 C-20 -22 20 -22 25 -5 C28 16 -28 16 -25 -5 Z" fill="url(#roseHighlight)" />
      <path d="M-14 0 C-10 -12 10 -12 14 0 C16 10 -16 10 -14 0 Z" fill="#ff8ca0" opacity="0.8" />
      <circle cx="0" cy="0" r="7" fill="#52040d" />
    </g>

    <!-- Rose: Lower Center (x: 250, y: 295) -->
    <g transform="translate(250, 295) scale(1.02)">
      <ellipse cx="0" cy="0" rx="62" ry="54" fill="url(#roseDark)" />
      <path d="M-50 -16 C-42 -44 42 -44 50 -16 C54 30 -52 32 -50 -16 Z" fill="url(#roseRed)" />
      <path d="M-36 -8 C-30 -30 30 -30 36 -8 C40 22 -38 22 -36 -8 Z" fill="url(#roseBright)" />
      <path d="M-22 -2 C-16 -18 16 -18 22 -2 C24 14 -24 14 -22 -2 Z" fill="url(#roseHighlight)" />
      <circle cx="0" cy="0" r="8" fill="#47020a" />
    </g>

    <!-- Rose: Lower Left (x: 180, y: 295) -->
    <g transform="translate(180, 295) scale(0.88)">
      <ellipse cx="0" cy="0" rx="58" ry="50" fill="url(#roseDark)" />
      <path d="M-46 -15 C-38 -40 38 -40 46 -15 C49 26 -48 28 -46 -15 Z" fill="url(#roseRed)" />
      <path d="M-32 -8 C-26 -28 26 -28 32 -8 C35 20 -34 20 -32 -8 Z" fill="url(#roseBright)" />
      <path d="M-18 0 C-14 -15 14 -15 18 0 C20 12 -20 12 -18 0 Z" fill="url(#roseHighlight)" />
      <circle cx="0" cy="0" r="8" fill="#47020a" />
    </g>

    <!-- Rose: Lower Right (x: 320, y: 295) -->
    <g transform="translate(320, 295) scale(0.88)">
      <ellipse cx="0" cy="0" rx="58" ry="50" fill="url(#roseDark)" />
      <path d="M-46 -15 C-38 -40 38 -40 46 -15 C49 26 -48 28 -46 -15 Z" fill="url(#roseRed)" />
      <path d="M-32 -8 C-26 -28 26 -28 32 -8 C35 20 -34 20 -32 -8 Z" fill="url(#roseBright)" />
      <path d="M-18 0 C-14 -15 14 -15 18 0 C20 12 -20 12 -18 0 Z" fill="url(#roseHighlight)" />
      <circle cx="0" cy="0" r="8" fill="#47020a" />
    </g>

    <!-- RED SATIN RIBBON AND BOW -->
    <g>
      <!-- Ribbon Tails flowing downward -->
      <path d="M240 365 C220 400 180 435 170 485 C165 510 185 505 195 475 C210 430 240 395 248 375 Z" fill="url(#ribbonRed)" opacity="0.95" />
      <path d="M260 365 C280 400 320 435 330 485 C335 510 315 505 305 475 C290 430 260 395 252 375 Z" fill="url(#ribbonRed)" opacity="0.95" />

      <!-- Left Bow Loop -->
      <path d="M250 360 C210 320 160 330 165 370 C170 400 220 390 250 365 Z" fill="url(#ribbonRed)" />
      <path d="M245 362 C215 335 180 345 185 368 C190 388 225 380 245 365 Z" fill="#850a1a" opacity="0.6" />

      <!-- Right Bow Loop -->
      <path d="M250 360 C290 320 340 330 335 370 C330 400 280 390 250 365 Z" fill="url(#ribbonRed)" />
      <path d="M255 362 C285 335 320 345 315 368 C310 388 275 380 255 365 Z" fill="#850a1a" opacity="0.6" />

      <!-- Center Knot -->
      <ellipse cx="250" cy="363" rx="16" ry="14" fill="url(#ribbonKnot)" />
      <ellipse cx="248" cy="360" rx="8" ry="5" fill="#ff7a90" opacity="0.6" />
    </g>

    <!-- SPARKLES / DEW DROPS -->
    <circle cx="242" cy="205" r="2.5" fill="#ffffff" opacity="0.85" />
    <circle cx="258" cy="218" r="1.8" fill="#ffffff" opacity="0.9" />
    <circle cx="190" cy="230" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="300" cy="240" r="2.2" fill="#ffffff" opacity="0.85" />
    <circle cx="246" cy="285" r="2" fill="#ffffff" opacity="0.8" />
  </g>
</svg>

